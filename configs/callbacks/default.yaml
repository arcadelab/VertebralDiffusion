defaults:
  - model_checkpoint.yaml
  - model_summary.yaml
  #- rich_progress_bar.yaml
  - _self_
#- early_stopping no early stopping loss for now

model_checkpoint:
  dirpath: ${paths.output_dir}/checkpoints
  filename: "epoch_{epoch:03d}"
  monitor: "val/loss"
  mode: "max"
  save_last: True
  auto_insert_metric_name: False

early_stopping:
  monitor: "val/loss"
  patience: 100
  mode: "max"

model_summary:
  max_depth: -1
