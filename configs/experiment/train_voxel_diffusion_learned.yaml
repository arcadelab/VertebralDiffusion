# @package _global_

# to execute this experiment run:
# python train.py experiment=train_vqgan

defaults:
  - override /model: voxel_diffusion_learned.yaml
  - override /trainer: gpu.yaml
  - override /data: vertebrae_learned_sim.yaml

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

task_name: "train_voxel_diffusion_learned"

tags: ["voxel_diffusion_learned"]

seed: 12345

trainer:
  #min_epochs: 10
  max_epochs: 1000
  #gradient_clip_val: 0.5

data:
  batch_size: 1 # 12 orig



callbacks:

  model_checkpoint:
    monitor: "train/loss"

logger:
  wandb:
    tags: ${tags}
    group: "voxel_diffusion_learned"
  aim:
    experiment: "train_voxel_diffusion_learned"
